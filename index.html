<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group File Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen py-10">
  <div class="max-w-4xl mx-auto px-6">
    <div class="text-center mb-12">
      <h1 class="text-5xl font-bold text-blue-600">📁 Group File Share</h1>
      <p class="text-xl text-gray-600 mt-2">WhatsApp Group ke liye</p>
    </div>

    <div class="flex flex-wrap justify-center gap-4 mb-12">
      <button onclick="uploadFiles()" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-5 rounded-3xl text-xl font-semibold flex items-center gap-3 shadow-lg">
        <i class="fas fa-upload"></i>
        Upload New Files
      </button>

      <button onclick="loadFiles()" 
              class="bg-gray-800 hover:bg-gray-900 text-white px-10 py-5 rounded-3xl text-xl font-semibold flex items-center gap-3 shadow-lg">
        <i class="fas fa-sync"></i>
        Refresh Files
      </button>
    </div>

    <div id="status" class="text-center text-lg mb-8 text-gray-700 min-h-[30px]"></div>

    <div id="files-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    </div>
  </div>

  <script>
    const OWNER = "copa1093-ops";
    const REPO = "DATA";
    const FOLDER = "uploads";

    // Upload ke liye sabse safe link
    function uploadFiles() {
      window.open(`https://github.com/${OWNER}/${REPO}/tree/main/${FOLDER}`, "_blank");
    }

    async function loadFiles() {
      const status = document.getElementById("status");
      const list = document.getElementById("files-list");
      
      status.textContent = "Files load ho rahe hain...";
      list.innerHTML = "";

      try {
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`);
        
        if (!response.ok) {
          status.textContent = "Abhi koi file nahi hai. Upload button se file daal do.";
          return;
        }

        const files = await response.json();
        const realFiles = files.filter(file => file.type === "file" && file.name !== ".gitkeep");

        if (realFiles.length === 0) {
          status.textContent = "Abhi koi file nahi hai. Upload button se file daal do.";
          return;
        }

        let html = "";
        realFiles.forEach(file => {
          const downloadUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file.name)}`;
          const sizeKB = (file.size / 1024).toFixed(1);

          html += `
            <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm hover:shadow-md transition">
              <div class="flex gap-4">
                <i class="fas fa-file text-5xl text-blue-500"></i>
                <div class="flex-1">
                  <h3 class="font-semibold text-lg break-all">${file.name}</h3>
                  <p class="text-gray-500 text-sm">${sizeKB} KB</p>
                  <a href="${downloadUrl}" download="${file.name}" 
                     class="mt-6 block w-full text-center bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl font-medium">
                    ⬇️ Download File
                  </a>
                </div>
              </div>
            </div>`;
        });

        list.innerHTML = html;
        status.innerHTML = `<span class="text-green-600 font-medium">${realFiles.length} files ready hain</span>`;

      } catch (err) {
        status.textContent = "Abhi uploads folder khali hai. Pehle Upload New Files button se file daal do.";
      }
    }

    // Page khulte hi files load ho jayenge
    window.onload = loadFiles;
  </script>
</body>
</html>
