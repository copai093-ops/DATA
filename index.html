<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group File Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen py-12">
  <div class="max-w-4xl mx-auto px-6">
    <h1 class="text-4xl font-bold text-center text-blue-700 mb-2">📁 Group File Share</h1>
    <p class="text-center text-gray-600 mb-10">WhatsApp Group ke liye</p>

    <div class="flex justify-center gap-6 mb-12">
      <button onclick="uploadClick()" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl text-lg font-semibold flex items-center gap-3">
        <i class="fas fa-upload"></i> Upload New Files
      </button>
      <button onclick="loadFiles()" class="bg-gray-700 hover:bg-gray-800 text-white px-8 py-4 rounded-2xl text-lg font-semibold flex items-center gap-3">
        <i class="fas fa-refresh"></i> Refresh
      </button>
    </div>

    <div id="status" class="text-center text-lg mb-8"></div>
    <div id="files" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </div>

  <script>
    const owner = "copa1093-ops";
    const repo = "DATA";

    function uploadClick() {
      window.open(`https://github.com/${owner}/${repo}/uploads`, "_blank");
    }

    async function loadFiles() {
      document.getElementById("status").textContent = "Loading...";
      document.getElementById("files").innerHTML = "";

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/uploads`);
        if (!res.ok) throw new Error();

        const data = await res.json();
        const realFiles = data.filter(f => f.type === "file" && f.name !== ".gitkeep");

        if (realFiles.length === 0) {
          document.getElementById("status").innerHTML = "Abhi koi file nahi hai. Upload button se daal do.";
          return;
        }

        let html = "";
        realFiles.forEach(file => {
          const url = `https://raw.githubusercontent.com/${owner}/${repo}/main/uploads/${encodeURIComponent(file.name)}`;
          html += `
            <div class="bg-white p-6 rounded-3xl shadow">
              <p class="font-medium break-all">${file.name}</p>
              <a href="${url}" download class="mt-4 block text-center bg-green-600 text-white py-3 rounded-2xl">
                Download
              </a>
            </div>`;
        });

        document.getElementById("files").innerHTML = html;
        document.getElementById("status").innerHTML = `<span class="text-green-600">${realFiles.length} files hain</span>`;
      } catch(e) {
        document.getElementById("status").textContent = "Koi file nahi mila. Pehle upload karo.";
      }
    }

    window.onload = loadFiles;
  </script>
</body>
</html>
