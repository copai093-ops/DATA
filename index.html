<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>अपना भविष्य देखें!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 480px;
    }
    h1 { font-size: 2.8rem; margin-bottom: 10px; color: #00ffea; text-shadow: 0 0 10px #00ffea; }
    p.subtitle { font-size: 1.3rem; margin-bottom: 30px; color: #e0e0e0; }
    label { display: block; text-align: left; margin: 15px 0 5px; font-size: 1.1rem; }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    input::placeholder { color: rgba(255,255,255,0.7); }
    button {
      width: 100%;
      padding: 14px;
      background: #00ffea;
      color: black;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover { background: #00d4c0; transform: translateY(-3px); }
    #waitingScreen { display: none; }
    #userNameDisplay { font-size: 2.8rem; font-weight: bold; color: #ffeb3b; text-shadow: 0 0 20px #ffeb3b; margin-bottom: 15px; }
    #waitingMessage { font-size: 1.8rem; color: #ff4d4d; text-shadow: 0 0 15px #ff1a1a; margin: 20px 0 35px; }
    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.12);
      border-radius: 30px;
      height: 24px;
      margin: 30px 0;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #00ffea, #00d4c0, #00ffea);
      background-size: 200% 100%;
      animation: gradient 3s linear infinite;
      transition: width 11s linear;
      border-radius: 30px;
    }
    @keyframes gradient { 0% {background-position: 0% 50%;} 100% {background-position: 200% 50%;} }
    #statusText { font-size: 1.35rem; color: #b0faff; min-height: 80px; margin-top: 25px; line-height: 1.5; }
    #videoContainer {
      display: none;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }
    .future-text {
      font-size: 2.5rem;
      color: #ffeb3b;
      text-shadow: 0 0 20px #ff6f00, 0 0 30px #ffeb3b;
      margin: 0 0 25px 0;
      padding: 15px;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      display: inline-block;
    }
    video {
      width: 100%;
      height: 506px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,255,234,0.4);
      background: #000;
    }
  </style>
</head>
<body>
  <div class="container" id="formContainer">
    <h1>अपना भविष्य देखें!</h1>
    <p class="subtitle">कृपया भविष्य देखने के लिए नीचे दी गई जानकारी भरे</p>
    <form id="myForm">
      <label for="name">Tera Naam:</label>
      <input type="text" id="name" placeholder="Yahan naam likh do..." required>
      <label for="dob">Janm Tithi (DOB):</label>
      <input type="date" id="dob" required>
      <button type="submit">Dekhna Shuru Kare →</button>
    </form>
  </div>

  <div class="container" id="waitingScreen">
    <div id="userNameDisplay"></div>
    <div id="waitingMessage">कृपया सब्र करें...<br>आपका भविष्य इतना भी उज्ज्वल नहीं है 😈</div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div id="statusText"></div>
  </div>

  <div id="videoContainer">
    <div style="text-align: center;">
      <h2 class="future-text">Tumhre bhavishya me ...</h2>
    </div>
    <video id="futureVideo" controls playsinline>
      <source src="Video1" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz34NNV-KIY6bJn3xJ8PJhFJ1NOeH713lJo0neNj_X7mE4mVuqcObiSxTg2gyGavtXY/exec";

    const messages = [
      "आपकी राशि match कर ली गई है 🔮",
      "पंडित Elon Musk से संपर्क किया जा रहा है...",
      "ग्रह-नक्षत्रों की दृष्टि देखी जा रही है 🌑✨",
      "2026 के भाग्य को स्कैन किया जा रहा है...",
      "कुंडली का deep scan चल रहा है...",
      "आपका भाग्य सफलतापूर्वक fetch किया गया! 🚀"
    ];

    let canShowVideo = false;

    document.getElementById("myForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const dob = document.getElementById("dob").value;

      if (!name || !dob) {
        alert("Naam aur DOB dono daal do bhai!");
        return;
      }

      // UI change
      document.getElementById("formContainer").style.display = "none";
      document.getElementById("waitingScreen").style.display = "block";
      document.getElementById("userNameDisplay").textContent = name + "!";

      const progressBar = document.getElementById("progressBar");
      setTimeout(() => { progressBar.style.width = "100%"; }, 100);

      const statusText = document.getElementById("statusText");
      let index = 0;
      const interval = setInterval(() => {
        statusText.textContent = messages[index];
        index++;
        if (index >= messages.length) {
          clearInterval(interval);
          statusText.textContent = "भविष्य तैयार हो रहा है... 🔥";
          // Animation पूरा → अब video दिखाने की permission
          canShowVideo = true;
          // अगर data save हो चुका हो तो तुरंत दिखा दो, नहीं तो 3-4 सेकंड बाद
          setTimeout(tryShowVideo, 4000);
        }
      }, 1800);

      // Background में data save करो
      saveToSheet(name, dob);
    });

    async function saveToSheet(name, dob) {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",  // CORS issue avoid (response नहीं पढ़ पाएंगे, लेकिन POST जाएगा)
          redirect: "follow",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ name: name, dob: dob })
        });
        // no-cors में response opaque होता है, लेकिन request सफल होता है
        console.log("Data save request sent!");
      } catch (err) {
        console.error("Save error:", err);
      }
    }

    function tryShowVideo() {
      if (canShowVideo) {
        document.getElementById("waitingScreen").style.display = "none";
        document.getElementById("videoContainer").style.display = "block";

        const video = document.getElementById("futureVideo");
        video.load();  // Reload source if needed
        video.play()
          .then(() => console.log("Video playing!"))
          .catch(err => {
            console.log("Autoplay blocked:", err);
            // User खुद play button दबाएगा
          });
      }
    }

    // Backup: अगर कुछ गड़बड़ हो तो 25 सेकंड बाद video दिखा दो
    setTimeout(() => {
      canShowVideo = true;
      tryShowVideo();
    }, 25000);
  </script>
</body>
</html>
