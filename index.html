<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuch Naya Dekhe</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 450px;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #00ffea;
      text-shadow: 0 0 10px #00ffea;
    }
    p.subtitle {
      font-size: 1.3rem;
      margin-bottom: 30px;
      color: #e0e0e0;
    }
    label {
      display: block;
      text-align: left;
      margin: 15px 0 5px;
      font-size: 1.1rem;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00ffea;
      color: black;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #00d4c0;
      transform: translateY(-3px);
    }
    #waitingMessage {
      display: none;
      font-size: 1.6rem;
      color: #ff4d4d;
      text-shadow: 0 0 15px #ff1a1a;
      margin: 40px 0;
      padding: 20px;
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
    }
    #videoContainer {
      display: none;
      width: 100%;
      max-width: 900px;
    }
    video, iframe {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,255,234,0.4);
    }
  </style>
</head>
<body>
  <div class="container" id="formContainer">
    <h1>अपना भविष्य देखें!</h1>
    <p class="subtitle">कृपया भविष्य देखने के लिए नीचे दी गई जानकारी भरे</p>
   
    <form id="myForm">
      <label for="name">Tera Naam:</label>
      <input type="text" id="name" placeholder="Yahan naam likh do..." required>
     
      <label for="dob">Janm Tithi (DOB):</label>
      <input type="date" id="dob" required>
     
      <button type="submit">Dekhna Shuru Kare →</button>
    </form>

    <div id="waitingMessage">
      कृपया सब्र करें...<br>
      आपका भविष्य इतना भी उज्ज्वल नहीं है 😈
    </div>
  </div>

  <div id="videoContainer">
    <iframe
      width="100%" height="506"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0"
      title="Surprise Video"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    document.getElementById("myForm").addEventListener("submit", function(e) {
      e.preventDefault();

      let name = document.getElementById("name").value.trim();
      let dob = document.getElementById("dob").value;

      if (!name || !dob) {
        alert("Naam aur DOB dono daal do bhai!");
        return;
      }

      // Step 1: Form छुपाओ
      document.getElementById("formContainer").querySelector("form").style.display = "none";
      document.querySelector("h1").style.display = "none";
      document.querySelector(".subtitle").style.display = "none";

      // Step 2: Waiting message दिखाओ
      const waiting = document.getElementById("waitingMessage");
      waiting.style.display = "block";

      // Step 3: 3.5 सेकंड बाद वीडियो दिखाओ
      setTimeout(() => {
        waiting.style.display = "none";
        document.getElementById("videoContainer").style.display = "block";
      }, 3500); // 3500ms = 3.5 seconds (तुम 4000 भी कर सकते हो)
    });
  </script>
</body>
</html>
