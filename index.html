<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuch Naya Dekhe</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 480px;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #00ffea;
      text-shadow: 0 0 10px #00ffea;
    }
    p.subtitle {
      font-size: 1.3rem;
      margin-bottom: 30px;
      color: #e0e0e0;
    }
    label {
      display: block;
      text-align: left;
      margin: 15px 0 5px;
      font-size: 1.1rem;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00ffea;
      color: black;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #00d4c0;
      transform: translateY(-3px);
    }
    #waitingScreen {
      display: none;
    }
    #userNameDisplay {
      font-size: 2.8rem;
      font-weight: bold;
      color: #ffeb3b;
      text-shadow: 0 0 20px #ffeb3b;
      margin-bottom: 15px;
    }
    #waitingMessage {
      font-size: 1.8rem;
      color: #ff4d4d;
      text-shadow: 0 0 15px #ff1a1a;
      margin: 20px 0 35px;
    }
    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.12);
      border-radius: 30px;
      height: 24px;
      margin: 30px 0;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #00ffea, #00d4c0, #00ffea);
      background-size: 200% 100%;
      animation: gradient 3s linear infinite;
      transition: width 11s linear;
      border-radius: 30px;
    }
    @keyframes gradient {
      0% {background-position: 0% 50%;}
      100% {background-position: 200% 50%;}
    }
    #statusText {
      font-size: 1.35rem;
      color: #b0faff;
      min-height: 80px;
      margin-top: 25px;
      line-height: 1.5;
    }
    #videoContainer {
      display: none;
      width: 100%;
      max-width: 900px;
    }
    iframe {
      width: 100%;
      height: 506px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,255,234,0.4);
    }
  </style>
</head>
<body>
  <div class="container" id="formContainer">
    <h1>अपना भविष्य देखें!</h1>
    <p class="subtitle">कृपया भविष्य देखने के लिए नीचे दी गई जानकारी भरे</p>
   
    <form id="myForm">
      <label for="name">Tera Naam:</label>
      <input type="text" id="name" placeholder="Yahan naam likh do..." required>
     
      <label for="dob">Janm Tithi (DOB):</label>
      <input type="date" id="dob" required>
     
      <button type="submit">Dekhna Shuru
