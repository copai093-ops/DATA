<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group File Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .file-card { transition: all 0.2s; }
    .file-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-8">
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold text-blue-600 mb-2">📁 Group File Share</h1>
      <p class="text-xl text-gray-600">WhatsApp Group ke liye - Files Upload & Download</p>
    </div>

    <div class="flex flex-wrap gap-4 justify-center mb-10">
      <button onclick="goToUpload()" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl text-lg font-semibold flex items-center gap-3 shadow-lg">
        <i class="fas fa-upload"></i>
        Upload New Files
      </button>
      
      <button onclick="loadFiles()" 
              class="bg-gray-700 hover:bg-gray-800 text-white px-8 py-4 rounded-2xl text-lg font-semibold flex items-center gap-3 shadow-lg">
        <i class="fas fa-sync-alt"></i>
        Refresh Files List
      </button>
    </div>

    <div id="status" class="text-center text-gray-500 mb-6 text-lg"></div>
    
    <div id="files-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Files yahan dikhega -->
    </div>
  </div>

  <script>
    const OWNER = "copa1093-ops";
    const REPO = "DATA";
    const FOLDER = "uploads";

    async function loadFiles() {
      const status = document.getElementById("status");
      const list = document.getElementById("files-list");
      status.textContent = "Files load ho rahe hain...";
      list.innerHTML = "";

      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`);
        
        if (!res.ok) throw new Error();

        const files = await res.json();

        if (!Array.isArray(files) || files.length === 0) {
          list.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">
            <i class="fas fa-folder-open text-7xl mb-6"></i>
            <p class="text-2xl">Abhi koi file nahi hai</p>
            <p class="mt-2">Upload button daba ke files daal do</p>
          </div>`;
          status.textContent = "";
          return;
        }

        let html = "";
        files.forEach(file => {
          if (file.type === "file") {
            const downloadUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file.name)}`;
            const sizeKB = (file.size / 1024).toFixed(1);

            html += `
              <div class="file-card bg-white border border-gray-200 rounded-3xl p-6 shadow">
                <div class="flex gap-4">
                  <i class="fas fa-file text-5xl text-blue-500 mt-1"></i>
                  <div class="flex-1 min-w-0">
                    <h3 class="font-medium text-lg break-all">${file.name}</h3>
                    <p class="text-sm text-gray-500 mt-1">${sizeKB} KB</p>
                    <a href="${downloadUrl}" download="${file.name}"
                       class="mt-5 inline-flex items-center gap-2 bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-2xl text-sm font-medium transition">
                      <i class="fas fa-download"></i> Download
                    </a>
                  </div>
                </div>
              </div>`;
          }
        });

        list.innerHTML = html;
        status.textContent = `${files.length} files mil gaye`;

      } catch (err) {
        status.innerHTML = `<span class="text-red-500">Uploads folder mein abhi koi file nahi hai</span>`;
        list.innerHTML = `<div class="col-span-full text-center py-20 text-gray-400">
          <i class="fas fa-folder-open text-7xl mb-6"></i>
          <p class="text-xl">Pehla file upload kar ke test karo</p>
        </div>`;
      }
    }

    function goToUpload() {
      window.open(`https://github.com/${OWNER}/${REPO}/upload/main/${FOLDER}`, "_blank");
    }

    // Page khulte hi files load ho jayenge
    window.onload = loadFiles;
  </script>
</body>
</html>
