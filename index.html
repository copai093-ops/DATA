<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group File Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .file-card { transition: all 0.2s; }
    .file-card:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto p-6 md:p-8">
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold text-blue-600 mb-2">📁 Group File Share</h1>
      <p class="text-xl text-gray-600">WhatsApp Group - Files Upload aur Download Karo</p>
    </div>

    <div class="flex flex-wrap gap-4 justify-center mb-12">
      <button onclick="goToUpload()" 
              class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl text-lg font-semibold flex items-center gap-3 shadow-lg">
        <i class="fas fa-upload"></i>
        📤 Upload New Files
      </button>
      
      <button onclick="loadFiles()" 
              class="bg-gray-700 hover:bg-gray-800 text-white px-8 py-4 rounded-2xl text-lg font-semibold flex items-center gap-3 shadow-lg">
        <i class="fas fa-sync-alt"></i>
        🔄 Refresh Files
      </button>
    </div>

    <div id="status" class="text-center text-gray-600 mb-6 text-lg"></div>
    
    <div id="files-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
    </div>
  </div>

  <script>
    const OWNER = "copa1093-ops";
    const REPO = "DATA";
    const FOLDER = "uploads";

    async function loadFiles() {
      const status = document.getElementById("status");
      const list = document.getElementById("files-list");
      status.textContent = "Files load ho rahe hain...";
      list.innerHTML = "";

      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`);
        if (!res.ok) throw new Error();

        const files = await res.json();
        const realFiles = files.filter(f => f.type === "file" && f.name !== ".gitkeep");

        if (realFiles.length === 0) {
          status.textContent = "Abhi koi file nahi hai. Upload button se daal do.";
          return;
        }

        let html = "";
        realFiles.forEach(file => {
          const downloadUrl = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FOLDER}/${encodeURIComponent(file.name)}`;
          const size = (file.size / 1024).toFixed(1) + " KB";

          html += `
            <div class="file-card bg-white border border-gray-200 rounded-3xl p-6">
              <div class="flex gap-4">
                <i class="fas fa-file text-5xl text-blue-500"></i>
                <div class="flex-1">
                  <h3 class="font-medium break-all">${file.name}</h3>
                  <p class="text-sm text-gray-500">${size}</p>
                  <a href="${downloadUrl}" download="${file.name}" 
                     class="mt-6 block text-center bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-2xl font-medium">
                    ⬇️ Download
                  </a>
                </div>
              </div>
            </div>`;
        });

        list.innerHTML = html;
        status.textContent = `${realFiles.length} files ready hain ✅`;

      } catch (e) {
        status.textContent = "Abhi uploads folder khali hai. Pehla file upload karo.";
      }
    }

    // ←←← Yeh line change ki hai (best working method)
    function goToUpload() {
      window.open(`https://github.com/${OWNER}/${REPO}/tree/main/${FOLDER}`, "_blank");
    }

    window.onload = loadFiles;
  </script>
</body>
</html>
