<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kuch Naya Dekhe</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 480px;
    }
    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
      color: #00ffea;
      text-shadow: 0 0 10px #00ffea;
    }
    p.subtitle {
      font-size: 1.3rem;
      margin-bottom: 30px;
      color: #e0e0e0;
    }
    label {
      display: block;
      text-align: left;
      margin: 15px 0 5px;
      font-size: 1.1rem;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00ffea;
      color: black;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover {
      background: #00d4c0;
      transform: translateY(-3px);
    }
    #waitingScreen {
      display: none;
    }
    #userNameDisplay {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffeb3b;
      text-shadow: 0 0 15px #ffeb3b;
      margin-bottom: 10px;
    }
    #waitingMessage {
      font-size: 1.7rem;
      color: #ff4d4d;
      text-shadow: 0 0 15px #ff1a1a;
      margin: 20px 0 30px;
    }
    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.1);
      border-radius: 25px;
      height: 20px;
      margin: 25px 0;
      overflow: hidden;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #00ffea, #00d4c0);
      transition: width 4.5s linear;
      border-radius: 25px;
    }
    #statusText {
      font-size: 1.3rem;
      color: #b0faff;
      min-height: 60px;
      margin-top: 20px;
    }
    #videoContainer {
      display: none;
      width: 100%;
      max-width: 900px;
    }
    iframe {
      width: 100%;
      height: 506px;
      border-radius: 15px;
      box-shadow: 0 0 30px rgba(0,255,234,0.4);
    }
  </style>
</head>
<body>
  <div class="container" id="formContainer">
    <h1>अपना भविष्य देखें!</h1>
    <p class="subtitle">कृपया भविष्य देखने के लिए नीचे दी गई जानकारी भरे</p>
   
    <form id="myForm">
      <label for="name">Tera Naam:</label>
      <input type="text" id="name" placeholder="Yahan naam likh do..." required>
     
      <label for="dob">Janm Tithi (DOB):</label>
      <input type="date" id="dob" required>
     
      <button type="submit">Dekhna Shuru Kare →</button>
    </form>
  </div>

  <div class="container" id="waitingScreen">
    <div id="userNameDisplay"></div>
    <div id="waitingMessage">कृपया सब्र करें...<br>आपका भविष्य इतना भी उज्ज्वल नहीं है 😈</div>
    
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div id="statusText"></div>
  </div>

  <div id="videoContainer">
    <iframe
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=0"
      title="Surprise Video"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const messages = [
      "पंडित Elon Musk से संपर्क किया जा रहा है...",
      "आपकी राशि match कर ली गई है 🔮",
      "ग्रह-नक्षत्रों की दृष्टि देखी जा रही है 🌑✨",
      "2026 के भाग्य को स्कैन किया जा रहा है...",
      "कुंडली का deep scan चल रहा है...",
      "आपका भाग्य सफलतापूर्वक fetch किया गया! 🚀"
    ];

    document.getElementById("myForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const dob = document.getElementById("dob").value;

      if (!name || !dob) {
        alert("Naam aur DOB dono daal do bhai!");
        return;
      }

      // Form छुपाओ
      document.getElementById("formContainer").style.display = "none";

      // Waiting screen दिखाओ
      const waiting = document.getElementById("waitingScreen");
      waiting.style.display = "block";

      // नाम डाल दो
      document.getElementById("userNameDisplay").textContent = name + "!";

      // Progress bar शुरू
      const progressBar = document.getElementById("progressBar");
      progressBar.style.width = "0%";
      setTimeout(() => {
        progressBar.style.width = "100%";
      }, 100);

      // मैसेज बदलते रहो
      const statusText = document.getElementById("statusText");
      let index = 0;

      const interval = setInterval(() => {
        statusText.textContent = messages[index];
        index++;

        if (index >= messages.length) {
          clearInterval(interval);
          // आखिरी मैसेज के 1 सेकंड बाद वीडियो दिखाओ
          setTimeout(() => {
            waiting.style.display = "none";
            document.getElementById("videoContainer").style.display = "block";
          }, 1200);
        }
      }, 900); // हर 0.9 सेकंड में नया मैसेज (कुल ~5 सेकंड)

      // बैकअप: 5.5 सेकंड बाद वीडियो फोर्स कर दो
      setTimeout(() => {
        if (document.getElementById("videoContainer").style.display !== "block") {
          waiting.style.display = "none";
          document.getElementById("videoContainer").style.display = "block";
        }
      }, 5500);
    });
  </script>
</body>
</html>
